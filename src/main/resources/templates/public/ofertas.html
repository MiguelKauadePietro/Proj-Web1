<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-BR">
<head th:replace="~{layout/base :: head(#{offer.title})}"></head>
<body>

<nav th:replace="~{layout/base :: navbar}"></nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center">
        <h2 th:text="#{offer.title}">Ofertas de Estágio</h2>
        <a sec:authorize="hasRole('SECRETARIO')"
           th:href="@{/secretario/ofertas/nova}"
           class="btn btn-success"
           th:text="#{offer.new}">Nova Oferta</a>
    </div>
    <hr>

    <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensagemSucesso}"></span>
    </div>
    <div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${mensagemErro}"></span>
    </div>

    <div th:if="${#maps.isEmpty(ofertasComContagem)}" class="alert alert-info" th:text="#{offer.none}">
        Nenhuma oferta disponível.
    </div>

    <div th:unless="${#maps.isEmpty(ofertasComContagem)}" class="table-responsive">
    <table class="table table-striped table-hover align-middle">
        <thead class="table-primary">
        <tr>
            <th th:text="#{offer.name}">Nome</th>
            <th th:text="#{offer.semester}">Semestre</th>
            <th th:text="#{offer.start}">Início</th>
            <th th:text="#{offer.end}">Fim</th>
            <th th:text="#{offer.professor}">Professor Responsável</th>
            <th th:text="#{offer.students}">Alunos</th>
            <th th:text="#{offer.status}">Status</th>
            <th sec:authorize="hasAnyRole('SECRETARIO','PROFESSOR')" th:text="#{user.actions}">Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="entry : ${ofertasComContagem}">
            <td th:text="${entry.key.nome}"></td>
            <td th:text="${entry.key.semestre}"></td>
            <td th:text="${#temporals.format(entry.key.dataInicio, 'dd/MM/yyyy')}"></td>
            <td th:text="${#temporals.format(entry.key.dataFim, 'dd/MM/yyyy')}"></td>
            <td th:text="${entry.key.professorResponsavel != null ? entry.key.professorResponsavel.nomeCompleto : '-'}"></td>
            <td th:text="${entry.value}"></td>
            <td>
                <span class="badge rounded-pill text-wrap"
                      th:text="#{|status.${entry.key.status}|}"
                      th:classappend="${entry.key.status.name() == 'EM_ANDAMENTO'} ? 'text-bg-success' :
                                     (${entry.key.status.name() == 'EM_ATRASO'} ? 'text-bg-danger' :
                                     (${entry.key.status.name() == 'AGUARDANDO_ENCERRAMENTO'} ? 'text-bg-warning' :
                                      'text-bg-secondary'))">
                </span>
            </td>
            <td sec:authorize="hasAnyRole('SECRETARIO','PROFESSOR')">
                <div class="d-flex flex-column gap-2">
                    <a sec:authorize="hasRole('SECRETARIO')"
                       th:href="@{/secretario/ofertas/{id}/alunos(id=${entry.key.id})}"
                       class="btn btn-sm btn-primary"
                       th:text="#{offer.manageStudents}">
                        Gerenciar Alunos
                    </a>

                    <a sec:authorize="hasRole('PROFESSOR')"
                       th:if="${entry.key.status.name() == 'EM_ANDAMENTO'}"
                       th:href="@{/professor/ofertas/{id}/encerrar(id=${entry.key.id})}"
                       class="btn btn-sm btn-warning"
                       th:text="#{offer.requestClosure}">
                        Solicitar Encerramento
                    </a>

                    <a sec:authorize="hasRole('SECRETARIO')"
                       th:if="${entry.key.status.name() == 'AGUARDANDO_ENCERRAMENTO'}"
                       th:href="@{/secretario/ofertas/{id}/homologar(id=${entry.key.id})}"
                       class="btn btn-sm btn-success"
                       th:attr="onclick=|return confirm('${#messages.msg('offer.confirmHomologation')}');|"
                       th:text="#{offer.approveClosure}">
                        Homologar Encerramento
                    </a>

                    <span sec:authorize="hasRole('PROFESSOR')"
                          th:if="${entry.key.status.name() != 'EM_ANDAMENTO'}"
                          class="text-muted">-</span>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
    </div>
</div>

<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
