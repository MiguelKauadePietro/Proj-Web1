<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Nova Oferta</title>
    <style>
        @import url('https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css');
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">Sistema PESCD</a>
    </div>
</nav>

<div class="container bg-white p-4 rounded shadow-sm" style="max-width: 600px;">
    <h2 class="mb-4 text-secondary border-bottom pb-2">Cadastrar Nova Oferta</h2>

    <form th:action="@{/secretario/ofertas/salvar}" th:object="${oferta}" method="post">

        <div class="mb-3">
            <label class="form-label fw-bold">Nome da Oferta:</label>
            <input type="text" th:field="*{nome}" class="form-control" placeholder="Ex: Lógica Digital" required />
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Semestre:</label>
            <input type="text" th:field="*{semestre}" class="form-control" placeholder="Ex: 2026/1" required />
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Professor Responsável:</label>
            <select th:field="*{professorResponsavel}" class="form-select" required>
                <option value="">Selecione um professor...</option>
                <option th:each="prof : ${professores}"
                        th:value="${prof.id}"
                        th:text="${prof.username}">Nome do Professor</option>
            </select>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Data de Início:</label>
                <input type="date" th:field="*{dataInicio}" class="form-control" required />
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Data de Término:</label>
                <input type="date" th:field="*{dataFim}" class="form-control" required />
            </div>
        </div>

        <div class="mt-4 d-flex gap-2">
            <button type="submit" class="btn btn-success px-4">Criar Oferta</button>
            <a href="/ofertas" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>

</body>
</html>
