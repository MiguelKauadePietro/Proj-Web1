<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Alunos da Oferta</title>
    <style>
        @import url('https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css');
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">Sistema PESCD</a>
        <div class="d-flex">
            <a href="/ofertas" class="btn btn-outline-light btn-sm">Voltar para Ofertas</a>
        </div>
    </div>
</nav>

<div class="container mb-5">

    <div class="card shadow-sm mb-4">
        <div class="card-body bg-white rounded">
            <h2 class="text-secondary border-bottom pb-2" th:text="'Gerenciar Alunos: ' + ${oferta.nome}">Gerenciar Alunos</h2>
            <p class="mb-1"><strong>Semestre: </strong><span th:text="${oferta.semestre}"></span></p>
            <p class="mb-0"><strong>Professor Responsável: </strong><span th:text="${oferta.professorResponsavel != null ? oferta.professorResponsavel.nomeCompleto : '-'}"></span></p>
        </div>
    </div>

    <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensagemSucesso}"></span>
    </div>
    <div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${mensagemErro}"></span>
    </div>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-success text-white fw-bold">Importar Alunos via CSV</div>
                <div class="card-body bg-white">
                    <form th:action="@{/secretario/ofertas/{id}/alunos/upload-csv(id=${oferta.id})}" method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label text-muted small">Selecione um arquivo .csv com o cabeçalho <code>RA,NOME_COMPLETO,EMAIL</code> e um aluno por linha:</label>
                            <input type="file" name="arquivo" class="form-control" accept=".csv" required />
                        </div>
                        <button type="submit" class="btn btn-success w-100">Processar CSV</button>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white fw-bold">Matricular Aluno Manualmente</div>
                <div class="card-body bg-white">
                    <form th:action="@{/secretario/ofertas/{id}/alunos/adicionar(id=${oferta.id})}" method="post">
                        <div class="mb-3">
                            <label class="form-label text-muted small">Username (E-mail/Identificador):</label>
                            <input type="text" name="username" class="form-control" placeholder="Ex: aluno.exemplo" required />
                        </div>
                        <button type="submit" class="btn btn-dark w-100">Adicionar Aluno</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white fw-bold">Alunos Matriculados nesta Oferta</div>
                <div class="card-body bg-white p-0">

                    <div th:if="${#lists.isEmpty(alunos)}" class="p-4 text-center text-muted">
                        Nenhum aluno matriculado nesta oferta até o momento.
                    </div>

                    <div th:unless="${#lists.isEmpty(alunos)}" class="table-responsive">
                    <table class="table table-striped table-hover mb-0 align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>Aluno</th>
                            <th>Status do Processo</th>
                            <th class="text-center">Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="alunoOferta : ${alunos}">
                            <td class="fw-bold" th:text="${alunoOferta.aluno.nomeCompleto}"></td>
                            <td>
                                <span th:text="#{|statusAluno.${alunoOferta.status}|}" class="badge bg-secondary"></span>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/secretario/ofertas/{ofertaId}/alunos/{alunoOfertaId}/detalhes(ofertaId=${oferta.id}, alunoOfertaId=${alunoOferta.id})}"
                                   class="btn btn-sm btn-outline-primary me-1">
                                    Ver Detalhes
                                </a>
                                <a th:href="@{/secretario/ofertas/{ofertaId}/alunos/remover/{alunoOfertaId}(ofertaId=${oferta.id}, alunoOfertaId=${alunoOferta.id})}"
                                   class="btn btn-sm btn-outline-danger"
                                   onclick="return confirm('Tem certeza que deseja remover este aluno desta oferta?');">
                                    Remover
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
