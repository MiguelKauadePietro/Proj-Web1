<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{layout/base :: head(#{student.offer.list.title})}"></head>
<body>

<nav th:replace="~{layout/base :: navbar}"></nav>

<div class="container mt-4">
    <h2 th:text="#{student.offer.list.title}">Minhas Ofertas</h2>
    <p class="text-muted mb-4" th:text="#{student.offer.list.subtitle}">
        Visualize apenas as ofertas em que voce esta inscrito.
    </p>

    <div th:if="${mensagemSucesso}" class="alert alert-success" th:text="${mensagemSucesso}"></div>
    <div th:if="${mensagemErro}" class="alert alert-danger" th:text="${mensagemErro}"></div>

    <div th:if="${#lists.isEmpty(ofertasAluno)}" class="alert alert-info" th:text="#{student.offer.list.empty}">
        Voce ainda nao esta inscrito em ofertas.
    </div>

    <div th:unless="${#lists.isEmpty(ofertasAluno)}" class="table-responsive">
    <table class="table table-striped table-hover align-middle">
        <thead class="table-primary">
        <tr>
            <th th:text="#{offer.name}">Nome</th>
            <th th:text="#{offer.semester}">Semestre</th>
            <th th:text="#{offer.start}">Início</th>
            <th th:text="#{offer.end}">Fim</th>
            <th th:text="#{offer.professor}">Professor Responsável</th>
            <th th:text="#{offer.status}">Status da Oferta</th>
            <th th:text="#{student.offer.studentStatus}">Status do Aluno</th>
            <th th:text="#{user.actions}">Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="alunoOferta : ${ofertasAluno}">
            <td th:text="${alunoOferta.oferta.nome}"></td>
            <td th:text="${alunoOferta.oferta.semestre}"></td>
            <td th:text="${alunoOferta.oferta.dataInicio != null ? #temporals.format(alunoOferta.oferta.dataInicio, 'dd/MM/yyyy') : '-'}"></td>
            <td th:text="${alunoOferta.oferta.dataFim != null ? #temporals.format(alunoOferta.oferta.dataFim, 'dd/MM/yyyy') : '-'}"></td>
            <td th:text="${alunoOferta.oferta.professorResponsavel != null ? alunoOferta.oferta.professorResponsavel.nomeCompleto : '-'}"></td>
            <td>
                <span th:text="#{|status.${alunoOferta.oferta.status}|}"
                      th:classappend="${alunoOferta.oferta.status.name() == 'EM_ANDAMENTO'} ? 'badge bg-success' :
                                     (${alunoOferta.oferta.status.name() == 'EM_ATRASO'} ? 'badge bg-warning text-dark' :
                                     (${alunoOferta.oferta.status.name() == 'AGUARDANDO_ENCERRAMENTO'} ? 'badge bg-info text-dark' :
                                      'badge bg-secondary'))">
                </span>
            </td>
            <td>
                <span class="badge bg-secondary" th:text="#{|statusAluno.${alunoOferta.status}|}">Nao enviado</span>
            </td>
            <td>
                <a class="btn btn-sm btn-outline-primary"
                   th:href="@{/aluno/ofertas/{id}(id=${alunoOferta.id})}"
                   th:text="#{student.offer.details}">Detalhes</a>
            </td>
        </tr>
        </tbody>
    </table>
    </div>
</div>

<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
