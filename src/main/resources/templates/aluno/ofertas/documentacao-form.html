<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{layout/base :: head(#{student.documentation.title})}"></head>
<body>

<nav th:replace="~{layout/base :: navbar}"></nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 th:text="#{student.documentation.title}">Enviar Documentação de Docência</h2>
            <p class="text-muted mb-0" th:text="${alunoOferta.oferta.nome}">Oferta</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/aluno/ofertas/{id}(id=${alunoOferta.id})}" th:text="#{student.offer.back}">
            Voltar
        </a>
    </div>

    <div th:if="${mensagemErro}" class="alert alert-danger" th:text="${mensagemErro}"></div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/aluno/ofertas/{id}/documentacao(id=${alunoOferta.id})}" th:object="${documentacaoForm}" method="post" enctype="multipart/form-data">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="nomeInstituicao" class="form-label" th:text="#{student.documentation.nomeInstituicao}">Instituição</label>
                        <input id="nomeInstituicao" type="text" class="form-control" th:field="*{nomeInstituicao}">
                        <div class="text-danger small" th:if="${#fields.hasErrors('nomeInstituicao')}" th:errors="*{nomeInstituicao}"></div>
                    </div>

                    <div class="col-md-6">
                        <label for="nomeDisciplina" class="form-label" th:text="#{student.documentation.nomeDisciplina}">Disciplina</label>
                        <input id="nomeDisciplina" type="text" class="form-control" th:field="*{nomeDisciplina}">
                        <div class="text-danger small" th:if="${#fields.hasErrors('nomeDisciplina')}" th:errors="*{nomeDisciplina}"></div>
                    </div>

                    <div class="col-md-6">
                        <label for="cursoDisciplina" class="form-label" th:text="#{student.documentation.cursoDisciplina}">Curso</label>
                        <input id="cursoDisciplina" type="text" class="form-control" th:field="*{cursoDisciplina}">
                        <div class="text-danger small" th:if="${#fields.hasErrors('cursoDisciplina')}" th:errors="*{cursoDisciplina}"></div>
                    </div>

                    <div class="col-md-6">
                        <label for="cargaHoraria" class="form-label" th:text="#{student.documentation.cargaHoraria}">Carga Horária</label>
                        <input id="cargaHoraria" type="number" min="1" class="form-control" th:field="*{cargaHoraria}">
                        <div class="text-danger small" th:if="${#fields.hasErrors('cargaHoraria')}" th:errors="*{cargaHoraria}"></div>
                    </div>

                    <div class="col-12">
                        <label for="arquivo" class="form-label" th:text="#{student.documentation.arquivo}">Arquivo PDF</label>
                        <input id="arquivo" type="file" class="form-control" th:field="*{arquivo}" accept="application/pdf,.pdf">
                        <div class="form-text" th:text="#{student.documentation.arquivo.hint}">Envie um PDF com no máximo 5MB.</div>
                        <div class="text-danger small" th:if="${#fields.hasErrors('arquivo')}" th:errors="*{arquivo}"></div>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary" th:text="#{student.documentation.submit}">Enviar documentação</button>
                    <a class="btn btn-outline-secondary" th:href="@{/aluno/ofertas/{id}(id=${alunoOferta.id})}" th:text="#{user.cancel}">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
