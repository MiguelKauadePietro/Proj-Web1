<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{layout/base :: head(#{error.403.title})}"></head>
<body>
<nav th:replace="~{layout/base :: navbar}"></nav>
<div class="container mt-5 text-center">
    <div class="display-1 text-danger">403</div>
    <h2 th:text="#{error.403.title}">Acesso Negado</h2>
    <p class="lead" th:text="#{error.403.message}">Você não tem permissão para acessar esta página.</p>
    <a th:href="@{/}" class="btn btn-primary" th:text="#{error.back}">Voltar ao Início</a>
</div>
<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
