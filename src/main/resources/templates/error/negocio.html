<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{layout/base :: head(#{error.business.title})}"></head>
<body>
<nav th:replace="~{layout/base :: navbar}"></nav>
<div class="container mt-5 text-center">
    <div class="display-1 text-warning">&#9888;</div>
    <h2 th:text="#{error.business.title}">Operação não permitida</h2>
    <p class="lead" th:text="${message} ?: #{error.business.message}">Esta operação não pôde ser concluída.</p>
    <a th:href="@{/}" class="btn btn-primary" th:text="#{error.back}">Voltar ao Início</a>
</div>
<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
