<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{layout/base :: head(#{error.404.title})}"></head>
<body>
<nav th:replace="~{layout/base :: navbar}"></nav>
<div class="container mt-5 text-center">
    <div class="display-1 text-warning">404</div>
    <h2 th:text="#{error.404.title}">Página Não Encontrada</h2>
    <p class="lead" th:text="#{error.404.message}">O recurso solicitado não foi encontrado.</p>
    <a th:href="@{/}" class="btn btn-primary" th:text="#{error.back}">Voltar ao Início</a>
</div>
<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
