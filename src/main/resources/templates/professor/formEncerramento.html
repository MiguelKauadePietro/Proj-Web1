<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Solicitar Encerramento de Oferta</title>
    <style>
        @import url('https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css');
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">Sistema PESCD - Painel do Professor</a>
        <div class="d-flex">
            <a href="/ofertas" class="btn btn-outline-light btn-sm">Voltar</a>
        </div>
    </div>
</nav>

<div class="container mb-5" style="max-width: 700px;">
    <div class="card shadow-sm">
        <div class="card-header bg-warning text-dark fw-bold">
            Solicitação de Encerramento de Estágio Docente
        </div>
        <div class="card-body bg-white rounded-bottom">
            <h4 class="text-secondary mb-3" th:text="${oferta.nome}">Nome da Oferta</h4>
            <p class="text-muted small">Preencha os campos abaixo com o relatório final e as instruções para que a secretaria homologue o encerramento.</p>

            <form th:action="@{/professor/ofertas/{id}/encerrar(id=${oferta.id})}" method="post">

                <div class="mb-3">
                    <label for="licoesAprendidas" class="form-label fw-bold">Lições Aprendidas:</label>
                    <textarea class="form-control" id="licoesAprendidas" name="licoesAprendidas" rows="4"
                              placeholder="Descreva o aprendizado obtido pelos alunos nesta oferta..." required></textarea>
                </div>

                <div class="mb-3">
                    <label for="instrucaoEncerramento" class="form-label fw-bold">Instruções de Encerramento:</label>
                    <textarea class="form-control" id="instrucaoEncerramento" name="instrucaoEncerramento" rows="3"
                              placeholder="Observações finais ou instruções para a secretaria..." required></textarea>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="/ofertas" class="btn btn-light border">Cancelar</a>
                    <button type="submit" class="btn btn-warning">Enviar para a Secretaria</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
