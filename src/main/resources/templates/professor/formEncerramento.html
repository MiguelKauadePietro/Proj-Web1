<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{layout/base :: head('Encerrar Oferta')}"></head>
<body>

<nav th:replace="~{layout/base :: navbar}"></nav>

<div class="container mt-4 mb-5">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Encerrar Oferta</h2>
        <a href="/professor" class="btn btn-outline-secondary">Voltar</a>
    </div>

    <h5 class="text-muted mb-4" th:text="${oferta.nome}"></h5>

    <div th:if="${mensagemErro}" class="alert alert-danger" th:text="${mensagemErro}"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-header fw-bold">Resumo dos Alunos</div>
        <div class="card-body p-0">
            <table class="table table-striped align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Aluno</th>
                    <th>Tipo de Crédito</th>
                    <th>Frequência</th>
                    <th>Nota</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="ao : ${alunos}">
                    <td th:text="${ao.aluno.nomeCompleto}"></td>
                    <td>
                        <span th:if="${ao.documentacao != null}" class="badge bg-info text-dark">Documentação</span>
                        <span th:if="${ao.documentacao == null}" class="badge bg-primary">Estágio</span>
                    </td>
                    <td>
                        <span th:if="${ao.documentacao != null}"
                              th:text="${ao.documentacao.frequencia + '%'}"></span>
                        <span th:if="${ao.documentacao == null and relatorios[ao.id] != null}"
                              th:text="${relatorios[ao.id].frequenciaResponsavel + '%'}"></span>
                    </td>
                    <td>
                        <span th:if="${ao.documentacao != null}"
                              th:text="${ao.documentacao.nota}"></span>
                        <span th:if="${ao.documentacao == null and relatorios[ao.id] != null}"
                              th:text="${relatorios[ao.id].notaResponsavel}"></span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-warning text-dark fw-bold">Confirmar Encerramento</div>
        <div class="card-body">
            <form th:action="@{/professor/ofertas/{id}/encerrar(id=${oferta.id})}" method="post">
                <div class="mb-3">
                    <label for="licoesAprendidas" class="form-label fw-bold">
                        Lições Aprendidas *
                    </label>

                    <textarea
                            class="form-control"
                            id="licoesAprendidas"
                            name="licoesAprendidas"
                            rows="4"
                            required></textarea>
                </div>

                <input type="hidden" id="instrucaoEncerramento" name="instrucaoEncerramento" value="Preenchido pelo Professor Responsável" />

                <div class="d-flex justify-content-end gap-2">
                    <a href="/professor" class="btn btn-light border">Cancelar</a>
                    <button type="submit" class="btn btn-warning">Encerrar Oferta</button>
                </div>
            </form>
        </div>
    </div>

</div>

<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
