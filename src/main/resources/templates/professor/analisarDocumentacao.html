<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{layout/base :: head(#{professor.documentation.review.title})}"></head>
<body>

<nav th:replace="~{layout/base :: navbar}"></nav>

<div class="container mb-5">

    <div class="card shadow-sm mb-4">
        <div class="card-body rounded">
            <h2 class="text-secondary border-bottom pb-2" th:text="#{professor.documentation.review.title}">Analisar Documentação de Docência</h2>
            <p class="mb-1"><strong th:text="#{professor.student} + ':'">Aluno:</strong> <span th:text="${alunoOferta.aluno.nomeCompleto}"></span></p>
            <p class="mb-1"><strong th:text="#{professor.offer} + ':'">Oferta:</strong> <span th:text="${alunoOferta.oferta.nome}"></span></p>
            <p class="mb-0"><strong th:text="#{professor.status} + ':'">Status:</strong> <span class="badge bg-secondary" th:text="#{|statusAluno.${alunoOferta.status}|}"></span></p>
        </div>
    </div>

    <div th:if="${alunoOferta.documentacao != null}" class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white fw-bold" th:text="#{professor.documentation.data}">Dados da Documentação</div>
        <div class="card-body">
            <p class="mb-1"><strong th:text="#{student.documentation.nomeInstituicao} + ':'">Instituição:</strong> <span th:text="${alunoOferta.documentacao.nomeInstituicao}"></span></p>
            <p class="mb-1"><strong th:text="#{student.documentation.nomeDisciplina} + ':'">Disciplina:</strong> <span th:text="${alunoOferta.documentacao.nomeDisciplina}"></span></p>
            <p class="mb-1"><strong th:text="#{student.documentation.cursoDisciplina} + ':'">Curso:</strong> <span th:text="${alunoOferta.documentacao.cursoDisciplina}"></span></p>
            <p class="mb-2"><strong th:text="#{student.documentation.cargaHoraria} + ':'">Carga Horária:</strong> <span th:text="${alunoOferta.documentacao.cargaHoraria}"></span>h</p>
            <a class="btn btn-outline-primary btn-sm"
               th:href="@{/arquivos/documentacao/{id}(id=${alunoOferta.id})}"
               target="_blank" rel="noopener"
               th:text="#{professor.documentation.viewPdf}">
                Ver PDF da documentação
            </a>
        </div>
    </div>

    <div th:if="${alunoOferta.documentacao != null}" class="card shadow-sm mb-4">
        <div class="card-header bg-light fw-bold" th:text="#{professor.grades.current}">Frequência e Nota já informadas</div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-6">
                    <strong th:text="#{professor.frequency.final}">Frequência final</strong>
                    <div th:text="${alunoOferta.documentacao.frequencia != null ? #numbers.formatDecimal(alunoOferta.documentacao.frequencia, 1, 2) + '%' : #messages.msg('professor.notDefined')}"></div>
                </div>
                <div class="col-md-6">
                    <strong th:text="#{professor.grade.final}">Nota final</strong>
                    <div th:text="${alunoOferta.documentacao.nota != null ? alunoOferta.documentacao.nota : #messages.msg('professor.notDefined')}"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white fw-bold" th:text="#{professor.analysis}">Análise</div>
        <div class="card-body">
            <form th:action="@{/professor/{id}/analisar-documentacao(id=${alunoOferta.id})}"
                  th:object="${form}"
                  method="post">

                <div class="mb-3">
                    <label class="form-label fw-bold" th:text="#{professor.opinion.required}">Parecer *</label>
                    <textarea th:field="*{parecer}" class="form-control" rows="5" required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold" th:text="#{professor.frequency.label}">Frequência (%) *</label>
                    <input type="number" th:field="*{frequencia}" class="form-control" min="0" max="100" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold" th:text="#{professor.grade.label}">Nota *</label>
                    <select th:field="*{sugestaoNota}" class="form-select" required>
                        <option value="" th:text="#{professor.select}">Selecione</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                        <option value="E">E</option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success" th:text="#{professor.analysis.finish}">Finalizar Análise</button>
                    <a href="/professor" class="btn btn-secondary" th:text="#{user.cancel}">Cancelar</a>
                </div>

            </form>
        </div>
    </div>

</div>

<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
