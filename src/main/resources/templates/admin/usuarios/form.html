<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{layout/base :: head(${usuarioId != null} ? #{user.edit} : #{user.new})}"></head>
<body>

<nav th:replace="~{layout/base :: navbar}"></nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <h2 th:text="${usuarioId != null} ? #{user.edit} : #{user.new}">Usuário</h2>
            <hr>

            <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

            <form th:action="${usuarioId != null} ? @{/admin/usuarios/{id}/editar(id=${usuarioId})} : @{/admin/usuarios/novo}"
                  th:object="${usuarioForm}" method="post">

                <div class="mb-3">
                    <label for="nomeCompleto" class="form-label" th:text="#{user.name}">Nome Completo</label>
                    <input type="text" class="form-control" id="nomeCompleto" th:field="*{nomeCompleto}"
                           th:classappend="${#fields.hasErrors('nomeCompleto')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{nomeCompleto}"></div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label" th:text="#{user.email}">E-mail</label>
                    <input type="email" class="form-control" id="email" th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label for="username" class="form-label" th:text="#{user.username}">Usuário</label>
                    <input type="text" class="form-control" id="username" th:field="*{username}"
                           th:readonly="${usuarioId != null}"
                           th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{username}"></div>
                </div>

                <div class="mb-3">
                    <label for="senha" class="form-label" th:text="#{user.password}">Senha</label>
                    <input type="password" class="form-control" id="senha" th:field="*{senha}"
                           th:classappend="${#fields.hasErrors('senha')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{senha}"></div>
                    <div class="form-text" th:if="${usuarioId != null}" th:text="#{user.password.hint}"></div>
                </div>

                <div class="mb-3">
                    <label for="perfil" class="form-label" th:text="#{user.profile}">Perfil</label>
                    <select class="form-select" id="perfil" th:field="*{perfil}"
                            th:classappend="${#fields.hasErrors('perfil')} ? 'is-invalid'">
                        <option value="" disabled>Selecione...</option>
                        <option th:each="p : ${perfis}" th:value="${p}" th:text="#{|perfil.${p}|}"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{perfil}"></div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary" th:text="#{user.save}">Salvar</button>
                    <a th:href="@{/admin/usuarios}" class="btn btn-secondary" th:text="#{user.cancel}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
